name: Scheduled dependency security audit
on:
  schedule:
    - cron: '42 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check source before any project/dependency execution
        run: node scripts/verify-source-integrity.mjs --ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      # Read the pinned lockfile; do not install/update dependencies or deploy.
      - run: npm audit --audit-level=moderate
