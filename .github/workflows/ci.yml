name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-ids:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savo_ids_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/savo_ids_ci?connection_limit=5&pool_timeout=20"
      MAIL_DELIVERY_MODE: "off"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real PostgreSQL numbering, rollback, exhaustion and concurrency
        run: npm run test:business-ids

  verify:
    runs-on: ubuntu-latest

    env:
      # Placeholder values — CI validates code, not data. DATABASE_URL is a
      # syntactically valid local URL; no database is contacted during build
      # (pages are built from constants; DB reads happen per-request at runtime
      # and fall back to constants when unreachable).
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/savo_ci"
      ENQUIRY_IP_SALT: "ci-only-salt"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Dependency audit (non-blocking report)
        run: npm audit --omit=dev || true
