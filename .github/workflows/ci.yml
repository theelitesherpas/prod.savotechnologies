name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savo_ids_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/savo_ids_ci?connection_limit=5&pool_timeout=20"
      MAIL_DELIVERY_MODE: "off"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Dependency-free source integrity gate
        run: node scripts/verify-source-integrity.mjs --ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate only the reviewed Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Real PostgreSQL numbering, rollback, exhaustion and concurrency
        run: npm run test:business-ids
      - name: Real PostgreSQL private attachment limits and concurrency
        run: node scripts/verify-email-attachments-db.mjs
      - name: Real PostgreSQL PayPal settlement, replay and availability
        run: node scripts/verify-paypal-db.mjs
      - name: Least-privilege database role and settlement proof
        run: node scripts/verify-db-privileges.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Synthetic CI data only. No production secrets, deployment keys or live mail.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/savo_ci"
      ENQUIRY_IP_SALT: "ci-only-salt"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      MAIL_DELIVERY_MODE: "off"
      PAYPAL_LIVE_PAYMENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Dependency-free source integrity gate
        run: node scripts/verify-source-integrity.mjs --ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/prisma/build/index.js generate
      - name: Bootstrap attack regression tests
        run: npm run test:security
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Known dependency advisory gate (including development tools)
        run: npm audit --audit-level=moderate
      - name: Registry signature and available provenance verification
        run: npm audit signatures
