</text><text x="345" y="243" fill="#294a5c" font-size="32" font-weight="600">An exception. A clear next step.</text><text x="345" y="282" fill="#6a7980" font-size="17" font-weight="400">Review queue / Synthetic operational data</text><rect x="345" y="323" width="947" height="414" rx="7" fill="#fff" stroke="none"/><rect x="370" y="349" width="161" height="32" rx="16" fill="#efe9df" stroke="none"/><text x="383" y="371" fill="#7c6036" font-size="15" font-weight="600">Needs review</text><text x="370" y="422" fill="#294a5c" font-size="28" font-weight="600">NS–1043 · Missing hand-off event</text><text x="370" y="464" fill="#6a7980" font-size="18" font-weight="400">The next carrier event has not been recorded in this sample.</text><path d="M370 495L1260 495" stroke="#dee2e7" stroke-width="1" fill="none"/><text x="370" y="536" fill="#6a7980" font-size="15" font-weight="400">Proposed owner</text><text x="370" y="568" fill="#294a5c" font-size="21" font-weight="600">Dispatch team</text><text x="812" y="536" fill="#6a7980" font-size="15" font-weight="400">Suggested action</text><text x="812" y="568" fill="#294a5c" font-size="21" font-weight="600">Verify with the source carrier</text><rect x="370" y="628" width="212" height="48" rx="7" fill="#294a5c" stroke="none"/><text x="390" y="659" fill="#fff" font-size="17" font-weight="600">Assign for review</text><text x="608" y="660" fill="#6a7980" font-size="16" font-weight="400">No carrier is contacted.</text><text x="100" y="861" fill="#53615d" font-size="15" font-weight="600">CONCEPT INTERFACE · SYNTHETIC DATA · NOT CLIENT WORK</text></g></svg>