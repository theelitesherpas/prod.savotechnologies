# http{} scope; Savo-specific zones/maps, no limits on other hosted sites.
map "$request_method:$uri" $savo_auth_limit_key {
    default "";
    ~^POST:/(admin/login|portal|employee-portal)/?$ $binary_remote_addr;
}
limit_req_zone $savo_auth_limit_key zone=savo_auth:10m rate=10r/m;
map $http_upgrade $savo_connection_upgrade {
    default upgrade;
    "" close;
}
# Provider webhooks, inbound email, attachment upload and ordinary GET requests
# have an empty auth-limit key; do not add CAPTCHA/challenges or broad API limits.
